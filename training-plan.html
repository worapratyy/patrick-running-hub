<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrick — 2026 Race Season</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #09090b;
  --s1:      #111113;
  --s2:      #18181b;
  --s3:      #222226;
  --border:  #27272a;
  --border2: #3f3f46;
  --text:    #e4e4e7;
  --muted:   #71717a;
  --muted2:  #a1a1aa;

  --green:   #00e5a0;
  --blue:    #3b82f6;
  --purple:  #a855f7;
  --orange:  #f97316;
  --teal:    #22d3ee;
  --red:     #ef4444;
  --gold:    #f5c842;

  --c-easy:     var(--green);
  --c-tempo:    var(--blue);
  --c-long:     var(--purple);
  --c-shakeout: var(--teal);
  --c-race:     var(--orange);
  --c-rest:     var(--muted);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg); color:var(--text);
  font-family:'Outfit', sans-serif; font-size:14px;
  min-height:100vh;
}

/* ── TOP ACCENT BAR ── */
body::before {
  content:''; display:block; height:2px; width:100%;
  background:linear-gradient(90deg,var(--green),var(--blue),var(--purple));
  position:fixed; top:0; left:0; z-index:200;
}

/* ── HEADER ── */
.hdr {
  position:fixed; top:2px; left:0; right:0; z-index:100;
  height:54px;
  background:rgba(9,9,11,.96); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px; padding:0 18px;
}
.hdr-brand { font-family:'Space Mono',monospace; font-size:13px; font-weight:700; color:var(--green); letter-spacing:.04em; white-space:nowrap; }
.hdr-div   { width:1px; height:20px; background:var(--border2); }
.hdr-sub   { font-size:11px; color:var(--muted); white-space:nowrap; }
.hdr-spacer{ flex:1; }
.hdr-stat  { text-align:right; padding:0 10px; }
.hdr-stat .hv { font-family:'Space Mono',monospace; font-size:14px; color:var(--text); }
.hdr-stat .hl { font-size:10px; color:var(--muted); margin-top:1px; }

/* shift ctrl */
.shift-ctrl {
  display:flex; align-items:center; gap:5px;
  background:var(--s2); border:1px solid var(--border);
  border-radius:7px; padding:4px 10px; margin-left:4px;
}
.shift-ctrl .slbl { font-size:10px; color:var(--muted); white-space:nowrap; }
.shift-ctrl .sval { font-family:'Space Mono',monospace; font-size:12px; font-weight:700; color:var(--orange); min-width:30px; text-align:center; }
.shift-ctrl .sval.zero { color:var(--muted2); }
.shift-ctrl button {
  background:var(--s1); border:1px solid var(--border2); color:var(--muted2);
  border-radius:4px; width:22px; height:22px; cursor:pointer; font-size:13px;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.shift-ctrl button:hover { border-color:var(--blue); color:var(--blue); }
.shift-ctrl .sreset { font-size:11px; background:none; border:none; color:var(--muted); cursor:pointer; }
.shift-ctrl .sreset:hover { color:var(--red); }

/* ── LAYOUT ── */
.layout {
  display:flex;
  padding-top:56px; /* header */
  min-height:100vh;
}

/* ── SIDEBAR ── */
.sidebar {
  width:272px; min-width:272px;
  position:sticky; top:56px; height:calc(100vh - 56px);
  overflow-y:auto;
  background:var(--s1); border-right:1px solid var(--border);
  padding:16px 14px;
  display:flex; flex-direction:column; gap:20px;
}

/* calendar */
.cal-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-hdr h3 { font-size:11px; font-weight:600; color:var(--muted2); letter-spacing:.08em; text-transform:uppercase; }
.cal-nav { display:flex; gap:4px; }
.cal-nav button { background:none; border:1px solid var(--border); color:var(--muted2); border-radius:4px; width:22px; height:22px; cursor:pointer; font-size:12px; }
.cal-nav button:hover { border-color:var(--border2); color:var(--text); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-dow { text-align:center; font-size:9px; color:var(--muted); padding:2px 0 4px; font-family:'Space Mono',monospace; }
.cal-day {
  aspect-ratio:1; border-radius:3px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:10px; font-family:'Space Mono',monospace;
  border:1px solid transparent; transition:border-color .12s;
  position:relative; overflow:hidden;
}
.cal-day:hover { border-color:var(--border2); }
.cal-day.empty { cursor:default; }
.cal-day.today { box-shadow:0 0 0 1.5px var(--green); }
.cal-day.selected { box-shadow:0 0 0 1.5px var(--blue) !important; }
.cal-day.t-easy     { background:#071f18; color:var(--green); }
.cal-day.t-tempo    { background:#071525; color:var(--blue); }
.cal-day.t-long     { background:#160d28; color:var(--purple); }
.cal-day.t-shakeout { background:#071e28; color:var(--teal); }
.cal-day.t-race     { background:#2a0d00; color:var(--orange); }
.cal-day.t-rest     { color:var(--muted); }
.cal-day.s-done::after { content:''; position:absolute; inset:0; background:rgba(0,229,160,.06); }
.cal-day.s-skipped::after { content:''; position:absolute; inset:0; background:rgba(239,68,68,.07); }
.cal-day .cd-n { font-size:11px; font-weight:500; line-height:1; }
.cal-day .cd-k { font-size:7.5px; margin-top:2px; opacity:.7; }
.cal-day .cd-dot { width:3px; height:3px; border-radius:50%; margin-top:2px; background:currentColor; }

/* stats */
.sxn-lbl { font-size:10px; font-weight:600; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; }
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.stat-card { background:var(--s2); border:1px solid var(--border); border-radius:7px; padding:9px 11px; }
.stat-card .sv { font-family:'Space Mono',monospace; font-size:17px; color:var(--text); }
.stat-card .sl { font-size:10px; color:var(--muted); margin-top:2px; }

/* progress */
.prog-wrap { display:flex; flex-direction:column; gap:9px; }
.prog-item {}
.prog-top { display:flex; justify-content:space-between; font-size:10px; color:var(--muted2); margin-bottom:3px; }
.prog-bar { height:3px; background:var(--s3); border-radius:2px; overflow:hidden; }
.prog-fill { height:100%; border-radius:2px; transition:width .4s; }

/* legend */
.legend { display:flex; flex-wrap:wrap; gap:6px; }
.leg-item { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted2); }
.leg-dot { width:7px; height:7px; border-radius:2px; flex-shrink:0; }

/* scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

/* ── MAIN ── */
.main {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:24px 28px;
  display:flex; flex-direction:column; gap:24px;
  max-width:900px;
}

/* shift when detail open */
body.detail-open .main { padding-right:360px; }

/* ── RACE COUNTDOWN ── */
.countdown-row {
  display:flex; gap:12px;
}
.rc-card {
  flex:1; background:var(--s1); border:1px solid var(--border);
  border-radius:10px; padding:16px 18px; cursor:pointer;
  transition:border-color .15s, background .15s;
  position:relative; overflow:hidden;
}
.rc-card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:var(--accent, var(--green));
}
.rc-card:hover { border-color:var(--border2); background:var(--s2); }
.rc-num {
  font-family:'Space Mono',monospace; font-size:36px; font-weight:700;
  color:var(--accent, var(--green)); line-height:1;
}
.rc-unit { font-size:10px; color:var(--muted); font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:.1em; margin-top:2px; }
.rc-divider { width:24px; height:1px; background:var(--border2); margin:10px 0; }
.rc-name { font-size:12px; font-weight:600; color:var(--text); }
.rc-target { font-size:11px; color:var(--muted2); margin-top:2px; font-family:'Space Mono',monospace; }

/* ── SECTION LABEL ── */
.sxn-title {
  font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.1em;
  text-transform:uppercase; margin-bottom:10px;
}

/* ── TODAY HERO ── */
.today-section {}
.today-hero {
  background:var(--s1); border:1px solid var(--border);
  border-radius:12px; overflow:hidden; cursor:pointer;
  transition:border-color .15s;
  position:relative;
}
.today-hero:hover { border-color:var(--border2); }
.today-hero.is-sel { border-color:var(--blue) !important; }

.th-bar { height:3px; }
.t-easy     .th-bar { background:var(--green); }
.t-tempo    .th-bar { background:var(--blue); }
.t-long     .th-bar { background:var(--purple); }
.t-shakeout .th-bar { background:var(--teal); }
.t-race     .th-bar { background:var(--orange); }
.t-rest     .th-bar { background:var(--border); }

.th-inner { padding:18px 22px; display:flex; align-items:center; gap:20px; }
.th-left { flex:1; }
.th-type-pill {
  display:inline-block; font-size:9px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; padding:3px 9px; border-radius:20px;
  font-family:'Space Mono',monospace; margin-bottom:8px;
}
.t-easy     .th-type-pill { background:#071f18; color:var(--green); border:1px solid #0a4030; }
.t-tempo    .th-type-pill { background:#071525; color:var(--blue); border:1px solid #0a2545; }
.t-long     .th-type-pill { background:#160d28; color:var(--purple); border:1px solid #2a1250; }
.t-shakeout .th-type-pill { background:#071e28; color:var(--teal); border:1px solid #0a3040; }
.t-race     .th-type-pill { background:#2a0d00; color:var(--orange); border:1px solid #4a1a00; }
.t-rest     .th-type-pill { background:var(--s2); color:var(--muted); border:1px solid var(--border); }

.th-name { font-size:17px; font-weight:600; color:var(--text); line-height:1.3; }
.th-notes-preview { font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5; max-height:36px; overflow:hidden; }
.th-status {
  margin-top:10px; font-size:11px; font-family:'Space Mono',monospace;
  display:inline-flex; align-items:center; gap:5px;
}
.th-status.done    { color:var(--green); }
.th-status.skip    { color:var(--red); }
.th-status.pending { color:var(--muted2); }

.th-right { display:flex; flex-direction:column; gap:12px; align-items:flex-end; flex-shrink:0; }
.th-metric { text-align:right; }
.th-val { font-family:'Space Mono',monospace; font-size:22px; font-weight:700; color:var(--text); }
.th-unit { font-size:10px; color:var(--muted); font-family:'Space Mono',monospace; display:block; text-align:right; margin-top:1px; }

.today-rest {
  background:var(--s1); border:1px solid var(--border); border-radius:12px;
  padding:20px 24px; font-size:13px; color:var(--muted);
}

/* ── WEEK STRIP ── */
.week-section {}
.week-hdr { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; }
.week-hdr-left {}
.week-sub { font-size:12px; color:var(--muted2); margin-top:2px; }
.week-stats { display:flex; gap:18px; }
.wstat { font-family:'Space Mono',monospace; font-size:12px; color:var(--muted2); }
.wstat .wv { color:var(--text); font-size:14px; }

.week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.day-pill {
  border-radius:8px; padding:10px 6px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; border:1px solid var(--border);
  transition:border-color .12s, background .12s;
  min-height:72px; position:relative; overflow:hidden;
}
.day-pill:hover { border-color:var(--border2); }
.day-pill.is-today { border-color:var(--green); box-shadow:0 0 16px rgba(0,229,160,.1); }
.day-pill.is-sel { border-color:var(--blue) !important; background:rgba(59,130,246,.05); }
.day-pill.is-past { opacity:.65; }
.day-pill.t-rest { background:transparent; cursor:default; }
.day-pill.t-easy     { background:#071f18; }
.day-pill.t-tempo    { background:#071525; }
.day-pill.t-long     { background:#160d28; }
.day-pill.t-shakeout { background:#071e28; }
.day-pill.t-race     { background:#2a0d00; }

.dp-dow { font-size:9px; color:var(--muted); font-family:'Space Mono',monospace; text-transform:uppercase; }
.dp-date { font-size:13px; font-weight:600; color:var(--text); font-family:'Space Mono',monospace; }
.dp-dot { width:5px; height:5px; border-radius:50%; }
.t-easy     .dp-dot { background:var(--green); }
.t-tempo    .dp-dot { background:var(--blue); }
.t-long     .dp-dot { background:var(--purple); }
.t-shakeout .dp-dot { background:var(--teal); }
.t-race     .dp-dot { background:var(--orange); }
.dp-km { font-size:9px; font-family:'Space Mono',monospace; color:var(--muted2); }
.dp-check { font-size:12px; color:var(--green); font-weight:700; }
.dp-today-dot { position:absolute; bottom:5px; left:50%; transform:translateX(-50%); width:3px; height:3px; border-radius:50%; background:var(--green); }

/* ── UPCOMING ── */
.upcoming-list { display:flex; flex-direction:column; gap:6px; }
.up-item {
  display:flex; align-items:center; gap:14px;
  background:var(--s1); border:1px solid var(--border);
  border-radius:9px; padding:12px 16px; cursor:pointer;
  transition:border-color .12s; position:relative; overflow:hidden;
}
.up-item:hover { border-color:var(--border2); background:var(--s2); }
.up-item::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
}
.t-easy     .up-item::before, .up-item.t-easy::before     { background:var(--green); }
.t-tempo    .up-item::before, .up-item.t-tempo::before    { background:var(--blue); }
.t-long     .up-item::before, .up-item.t-long::before     { background:var(--purple); }
.t-shakeout .up-item::before, .up-item.t-shakeout::before { background:var(--teal); }
.t-race     .up-item::before, .up-item.t-race::before     { background:var(--orange); }

.up-date-col { text-align:center; min-width:48px; flex-shrink:0; }
.up-dow  { font-size:9px; color:var(--muted); font-family:'Space Mono',monospace; text-transform:uppercase; }
.up-d    { font-size:12px; font-weight:700; font-family:'Space Mono',monospace; color:var(--text); margin-top:2px; }
.up-away { font-size:9px; color:var(--muted); margin-top:2px; }
.up-vdiv { width:1px; height:36px; background:var(--border); flex-shrink:0; }
.up-body { flex:1; }
.up-type { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-family:'Space Mono',monospace; margin-bottom:3px; }
.t-easy     .up-type { color:var(--green); }
.t-tempo    .up-type { color:var(--blue); }
.t-long     .up-type { color:var(--purple); }
.t-shakeout .up-type { color:var(--teal); }
.t-race     .up-type { color:var(--orange); }
.up-name { font-size:13px; font-weight:500; color:var(--text); }
.up-meta { text-align:right; font-family:'Space Mono',monospace; flex-shrink:0; }
.up-km   { font-size:15px; font-weight:700; color:var(--text); }
.up-km span { font-size:10px; color:var(--muted); font-weight:400; }
.up-pace { font-size:10px; color:var(--muted2); margin-top:2px; }

/* ── DETAIL PANEL ── */
.detail-wrap {
  position:fixed; right:0; top:56px; bottom:0; width:340px;
  background:var(--s1); border-left:1px solid var(--border);
  overflow-y:auto; padding:20px;
  transform:translateX(100%); transition:transform .22s ease;
  z-index:80;
}
.detail-wrap.open { transform:translateX(0); }
.det-close {
  position:absolute; top:12px; right:12px;
  background:none; border:1px solid var(--border); color:var(--muted2);
  border-radius:4px; width:26px; height:26px; cursor:pointer; font-size:14px;
}
.det-close:hover { border-color:var(--border2); color:var(--text); }
.det-date  { font-family:'Space Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:4px; }
.det-title { font-size:17px; font-weight:600; color:var(--text); margin-bottom:4px; line-height:1.3; }
.det-type  { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:16px; font-family:'Space Mono',monospace; }
.t-rest     .det-type { color:var(--muted); }
.t-easy     .det-type { color:var(--green); }
.t-tempo    .det-type { color:var(--blue); }
.t-long     .det-type { color:var(--purple); }
.t-shakeout .det-type { color:var(--teal); }
.t-race     .det-type { color:var(--orange); }

.det-metrics { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:16px; }
.det-m { background:var(--s2); border:1px solid var(--border); border-radius:7px; padding:9px 11px; }
.det-m .dm-val { font-family:'Space Mono',monospace; font-size:14px; color:var(--text); }
.det-m .dm-lbl { font-size:10px; color:var(--muted); margin-top:2px; }

.det-notes { font-size:12px; color:var(--muted2); line-height:1.65; margin-bottom:16px; white-space:pre-wrap; }

.det-status-wrap { margin-bottom:14px; }
.status-btns { display:flex; gap:5px; margin-top:7px; }
.status-btn {
  flex:1; padding:7px; border-radius:6px; cursor:pointer;
  font-size:11px; font-family:'Space Mono',monospace;
  border:1px solid var(--border); background:var(--s2); color:var(--muted2);
  transition:all .12s;
}
.status-btn:hover { border-color:var(--border2); color:var(--text); }
.status-btn.active-done    { background:#071f15; border-color:#0a4030; color:var(--green); }
.status-btn.active-pending { background:#1f1007; border-color:#40200a; color:var(--orange); }
.status-btn.active-skipped { background:#1f0708; border-color:#40100a; color:var(--red); }

.det-edit-btn {
  width:100%; padding:7px; border-radius:6px; cursor:pointer;
  font-size:11px; font-weight:600;
  background:var(--s2); border:1px solid var(--border); color:var(--muted2);
  transition:all .12s; margin-bottom:6px;
}
.det-edit-btn:hover { border-color:var(--border2); color:var(--text); }

.edit-form { display:none; flex-direction:column; gap:9px; margin-top:6px; }
.ef-row { display:flex; flex-direction:column; gap:3px; }
.ef-label { font-size:10px; color:var(--muted); }
.ef-input, .ef-select, .ef-textarea {
  background:var(--s2); border:1px solid var(--border);
  border-radius:5px; color:var(--text); font-family:'Space Mono',monospace; font-size:12px;
  padding:6px 8px; width:100%;
}
.ef-input:focus, .ef-select:focus, .ef-textarea:focus { outline:none; border-color:var(--blue); }
.ef-textarea { resize:vertical; min-height:70px; font-family:'Outfit',sans-serif; }
.ef-btns { display:flex; gap:6px; margin-top:4px; }
.ef-btn { flex:1; padding:7px; border-radius:5px; cursor:pointer; font-size:11px; font-weight:600; border:none; }
.ef-btn.save   { background:var(--blue); color:#fff; }
.ef-btn.cancel { background:var(--s2); color:var(--muted2); border:1px solid var(--border); }
.ef-btn:hover  { opacity:.85; }

.det-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:8px; color:var(--muted); text-align:center;
}
.det-empty svg { opacity:.3; }
.det-empty p { font-size:12px; line-height:1.5; }

/* move form */
.move-form { display:none; flex-direction:column; gap:10px; margin-top:6px; }
.move-form .mf-note { font-size:10px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>

<!-- TOP HEADER -->
<header class="hdr">
  <div class="hdr-brand">PATRICK · 2026</div>
  <div class="hdr-div"></div>
  <div class="hdr-sub">Race Season · Aug 16 → Oct 18 → Oct 25</div>
  <div class="hdr-spacer"></div>
  <div class="hdr-stat" id="hdrWeekly">
    <div class="hv">—</div>
    <div class="hl">This week km</div>
  </div>
  <div class="hdr-stat" id="hdrTotal">
    <div class="hv">—</div>
    <div class="hl">Total km</div>
  </div>
  <div class="hdr-stat" id="hdrDone">
    <div class="hv">—</div>
    <div class="hl">Sessions done</div>
  </div>
  <div class="shift-ctrl">
    <span class="slbl">Shift</span>
    <button onclick="shiftPlan(-1)">−</button>
    <span class="sval zero" id="shiftVal">0d</span>
    <button onclick="shiftPlan(+1)">+</button>
    <button class="sreset" onclick="resetShift()" title="Reset">↺</button>
  </div>
</header>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

const today = new Date();
function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
const todayStr = localDateStr(today);

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function load() {
  try { overrides = JSON.parse(localStorage.getItem('tp_overrides') || '{}'); } catch(e) { overrides = {}; }
  planOffset = parseInt(localStorage.getItem('tp_offset') || '0') || 0;
}
function save() {
  localStorage.setItem('tp_overrides', JSON.stringify(overrides));
  localStorage.setItem('tp_offset', String(planOffset));
}

// ─── DATA HELPERS ─────────────────────────────────────────────────────────────
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return localDateStr(d);
}

function getDay(dateStr) {
  const ov = overrides[dateStr] || {};
  const direct = PLAN[dateStr];
  if (direct && direct.status === 'done') return { ...direct, ...ov };
  const lookupDate = planOffset !== 0 ? addDays(dateStr, -planOffset) : dateStr;
  const base = PLAN[lookupDate];
  if (base && base.status === 'done' && lookupDate !== dateStr) {
    return { type:"rest", name:"Rest / Off", km:0, pace:"", hr:"", notes:"", status:"pending", ...ov };
  }
  return { ...(base || { type:"rest", name:"Rest / Off", km:0, pace:"", hr:"", notes:"", status:"pending" }), ...ov };
}

function allDates() {
  const dates = new Set();
  for (const [date, session] of Object.entries(PLAN)) {
    if (session.status === 'done') dates.add(date);
    else dates.add(addDays(date, planOffset));
  }
  return [...dates].sort();
}

const DOW    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const d = new Date(ds + 'T00:00:00');
  return `${DOW[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

// ─── CALENDAR ────────────────────────────────────────────────────────────────
function renderCal() {
  if (calYear === undefined) { calYear = today.getFullYear(); calMonth = today.getMonth(); }
  document.getElementById('calMonthLabel').textContent = `${MONTHS[calMonth]} ${calYear}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['S','M','T','W','T','F','S'].forEach(d => {
    const el = document.createElement('div'); el.className = 'cal-dow'; el.textContent = d; grid.appendChild(el);
  });
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  for (let i=0; i<firstDay; i++) {
    const el = document.createElement('div'); el.className='cal-day empty'; grid.appendChild(el);
  }
  for (let d=1; d<=daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const day = PLAN[ds] ? getDay(ds) : null;
    const el = document.createElement('div');
    el.className = `cal-day${day?` t-${day.type} s-${day.status}`:''}${ds===todayStr?' today':''}${ds===sel?' selected':''}`;
    if (day) el.onclick = () => selectDay(ds);
    else el.style.cursor = 'default';
    el.innerHTML = `<span class="cd-n">${d}</span>${day&&day.km?`<span class="cd-k">${day.km}</span>`:(day&&day.type!=='rest'?`<span class="cd-dot"></span>`:'')}`;
    grid.appendChild(el);
  }
}

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(); }

// ─── STATS ───────────────────────────────────────────────────────────────────
function updateStats() {
  const dates = allDates();
  const totalKm   = dates.reduce((s,d) => s + (getDay(d).status==='done' ? (getDay(d).km||0) : 0), 0);
  const totalSess = dates.filter(d => getDay(d).status==='done').length;
  const totalRuns = dates.filter(d => getDay(d).status==='done' && getDay(d).type!=='rest').length;
  const skipped   = dates.filter(d => getDay(d).status==='skipped').length;

  const weekStart = new Date(today); weekStart.setDate(today.getDate() - today.getDay());
  const weekEnd   = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  const weekKm = dates.reduce((s,d) => {
    const dd = new Date(d+'T00:00:00');
    return s + (dd>=weekStart && dd<=weekEnd && getDay(d).status==='done' ? (getDay(d).km||0) : 0);
  }, 0);

  document.querySelector('#hdrWeekly .hv').textContent = weekKm.toFixed(1);
  document.querySelector('#hdrTotal  .hv').textContent = totalKm.toFixed(1);
  document.querySelector('#hdrDone   .hv').textContent = totalSess;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="sv">${totalKm.toFixed(1)}</div><div class="sl">Total km</div></div>
    <div class="stat-card"><div class="sv">${weekKm.toFixed(1)}</div><div class="sl">This week</div></div>
    <div class="stat-card"><div class="sv">${totalRuns}</div><div class="sl">Runs done</div></div>
    <div class="stat-card"><div class="sv">${skipped}</div><div class="sl">Skipped</div></div>
  `;

  const phases = [
    { label:"Base",    ids:["w1","w2","w3"] },
    { label:"Build 1", ids:["w4","w5","w6","w7","w8"] },
    { label:"Build 2", ids:["w10","w11","w12","w13","w14"] },
    { label:"10K Block",ids:["w16","w17","w18","w19","w20"] },
  ];
  const colours = ["#00e5a0","#3b82f6","#a855f7","#f97316"];
  const pw = document.getElementById('progWrap');
  pw.innerHTML = '';
  phases.forEach((ph,i) => {
    const wks = WEEKS.filter(w => ph.ids.includes(w.id));
    const phDates = wks.flatMap(w => {
      const ds=[]; const cur=new Date(w.start+'T00:00:00'); const end=new Date(w.end+'T00:00:00');
      while(cur<=end){ds.push(localDateStr(cur));cur.setDate(cur.getDate()+1);}
      return ds;
    }).filter(d => PLAN[d]);
    const done  = phDates.filter(d => getDay(d).status==='done').length;
    const total = phDates.length;
    const pct   = total ? Math.round(done/total*100) : 0;
    pw.innerHTML += `<div class="prog-item">
      <div class="prog-top"><span>${ph.label}</span><span>${pct}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${colours[i]}"></div></div>
    </div>`;
  });
}

  if (day.pace) met.innerHTML += `<div class="det-m"><div class="dm-val">${day.pace}</div><div class="dm-lbl">Target Pace</div></div>`;
  if (day.hr)   met.innerHTML += `<div class="det-m"><div class="dm-val">${day.hr}</div><div class="dm-lbl">Target HR</div></div>`;
  document.getElementById('detNotes').textContent = day.notes || '';
  ['Done','Pending','Skipped'].forEach(s => {
    const btn = document.getElementById('btn'+s);
    btn.className = 'status-btn' + (day.status === s.toLowerCase() ? ` active-${s.toLowerCase()}` : '');
  });
  document.getElementById('edForm').style.display   = 'none';
  document.getElementById('moveForm').style.display = 'none';
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('open');
  document.body.classList.remove('detail-open');
  sel = null;
  renderMain(); renderCal();
}

// ─── STATUS ──────────────────────────────────────────────────────────────────
function setStatus(status) {
  if (!sel) return;
  overrides[sel] = { ...(overrides[sel]||{}), status };
  save(); renderMain(); renderCal(); updateStats(); openDetail(sel);
}

// ─── EDIT ─────────────────────────────────────────────────────────────────────
function toggleEdit() {
  const form = document.getElementById('edForm');
  if (!sel) { form.style.display='none'; return; }
  if (form.style.display === 'flex') { form.style.display='none'; return; }
  const day = getDay(sel);
  document.getElementById('edName').value  = day.name  || '';
  document.getElementById('edType').value  = day.type  || 'rest';
  document.getElementById('edKm').value    = day.km    || '';
  document.getElementById('edPace').value  = day.pace  || '';
  document.getElementById('edHr').value    = day.hr    || '';
  document.getElementById('edNotes').value = day.notes || '';
  form.style.display = 'flex';
}

function saveEdit() {
  if (!sel) return;
  overrides[sel] = { ...(overrides[sel]||{}),
    name:  document.getElementById('edName').value,
    type:  document.getElementById('edType').value,
    km:    parseFloat(document.getElementById('edKm').value) || 0,
    pace:  document.getElementById('edPace').value,
    hr:    document.getElementById('edHr').value,
    notes: document.getElementById('edNotes').value,
  };
  save(); renderMain(); renderCal(); updateStats(); openDetail(sel);
  document.getElementById('edForm').style.display = 'none';
}

// ─── MOVE ─────────────────────────────────────────────────────────────────────
function toggleMove() {
  const form = document.getElementById('moveForm');
  if (form.style.display === 'flex') { form.style.display='none'; return; }
  document.getElementById('edForm').style.display = 'none';
  document.getElementById('moveDate').value = sel || '';
  form.style.display = 'flex';
}

function saveMove() {
  if (!sel) return;
  const newDate = document.getElementById('moveDate').value;
  if (!newDate || newDate === sel) { document.getElementById('moveForm').style.display='none'; return; }
  const day = getDay(sel);
  overrides[newDate] = { ...(overrides[newDate]||{}), name:day.name, type:day.type, km:day.km, pace:day.pace, hr:day.hr, notes:day.notes, status:day.status==='done'?'done':'pending' };
  overrides[sel] = { type:'rest', name:'Rest / Off', km:0, pace:'', hr:'', notes:'', status:'pending' };
  save();
  document.getElementById('moveForm').style.display = 'none';
  sel = newDate;
  renderMain(); renderCal(); updateStats(); openDetail(newDate);
}

// ─── PLAN SHIFT ───────────────────────────────────────────────────────────────
function updateShiftUI() {
  const el = document.getElementById('shiftVal');
  if (!el) return;
  el.textContent = planOffset === 0 ? '0d' : (planOffset > 0 ? '+' : '') + planOffset + 'd';
  el.className = 'sval' + (planOffset === 0 ? ' zero' : '');
}

function shiftPlan(delta) {
  planOffset += delta; save(); updateShiftUI(); sel = null;
  renderMain(); renderCal(); updateStats();
  document.getElementById('detailPanel').classList.remove('open');
  document.body.classList.remove('detail-open');
}

function resetShift() {
  planOffset = 0; save(); updateShiftUI(); sel = null;
  renderMain(); renderCal(); updateStats();
  document.getElementById('detailPanel').classList.remove('open');
  document.body.classList.remove('detail-open');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
updateShiftUI();
renderCal();
renderMain();
updateStats();
</script>
</body>
</html>
