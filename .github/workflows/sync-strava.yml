name: Sync Strava

on:
  schedule:
    # Daily at 17:00 UTC = midnight Bangkok (UTC+7)
    - cron: "0 17 * * *"
  workflow_dispatch: # manual trigger from GitHub UI → Actions tab → "Run workflow"
  repository_dispatch:
    types: [strava-activity] # Strava webhook triggers this via Cloudflare Worker

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Strava sync
        id: sync
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          output=$(python3 scripts/sync_strava.py)
          echo "$output"
          new_token=$(echo "$output" | grep "^NEW_REFRESH_TOKEN=" | cut -d= -f2-)
          echo "new_refresh_token=$new_token" >> $GITHUB_OUTPUT

      - name: Rotate refresh token secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set STRAVA_REFRESH_TOKEN \
            --repo ${{ github.repository }} \
            --body "${{ steps.sync.outputs.new_refresh_token }}"

      - name: Commit updated runs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/runs.json
          git diff --staged --quiet || git commit -m "sync: Strava runs $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
